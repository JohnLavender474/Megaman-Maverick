[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'
eclipse.project.name = appName + '-core'

dependencies {
  implementation project(':engine')

  api "com.badlogicgames.gdx-controllers:gdx-controllers-core:$gdxControllersVersion"
  api "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"
  api "com.badlogicgames.gdx:gdx:$gdxVersion"

  api "org.jetbrains.kotlin:kotlin-stdlib:$kotlinVersion"
  
  if(enableGraalNative == 'true') {
    implementation "io.github.berstanio:gdx-svmhelper-annotations:$graalHelperVersion"
  }

  testImplementation "com.badlogicgames.gdx:gdx:$gdxVersion"
  testImplementation "io.kotest:kotest-runner-junit5:$kotestVersion"
  testImplementation "io.kotest:kotest-assertions-core:$kotestVersion"
  testImplementation "io.kotest:kotest-property:$kotestVersion"
  testImplementation "io.mockk:mockk:$mockkVersion"
}

test {
  useJUnitPlatform()
  maxHeapSize = '1g'
  if (project.hasProperty('updateContactRuleSelection')) systemProperty 'updateContactRuleSelection', 'true'
  if (project.hasProperty('updateMegamanBodyFixtures')) systemProperty 'updateMegamanBodyFixtures', 'true'
  testLogging {
    events "passed", "skipped", "failed"
    showStandardStreams = false
    exceptionFormat = "full"
  }
}

testing {
  suites {
    smokeTest(JvmTestSuite) {
      useJUnitJupiter()
      dependencies {
        implementation project()
        implementation project(':engine')
        implementation sourceSets.test.output
        implementation "org.jetbrains.kotlin:kotlin-reflect:$kotlinVersion"
        implementation "com.badlogicgames.gdx:gdx-backend-headless:$gdxVersion"
        implementation "io.kotest:kotest-runner-junit5:$kotestVersion"
        implementation "io.kotest:kotest-assertions-core:$kotestVersion"
        implementation "io.mockk:mockk:$mockkVersion"
        runtimeOnly "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
      }
      targets {
        all {
          testTask.configure {
            workingDir = rootProject.file('assets')
            inputs.dir(rootProject.file('assets/sprites/sprite_sheets')).withPropertyName('spriteSheets')
            testLogging {
              events "skipped", "failed"
              showStandardStreams = false
              exceptionFormat = "full"
            }
          }
        }
      }
    }
  }
}

tasks.named('check') { dependsOn testing.suites.smokeTest }

def randomRuleFixture = tasks.register('detektRandomRuleFixture', dev.detekt.gradle.Detekt) {
  description = 'Runs the detekt random-call rules on a fixture of forbidden and allowed calls'
  setSource(files('src/detektFixture/kotlin'))
  classpath.setFrom(sourceSets.main.compileClasspath)
  jvmTarget = '17'
  config.setFrom(rootProject.file('config/detekt/detekt.yml'), file('src/detektFixture/detekt-fixture.yml'))
  ignoreFailures = true
  reports {
    html.required = false
    markdown.required = false
    sarif.required = false
    checkstyle.required = true
  }
}

tasks.register('verifyRandomRule') {
  description = 'Checks that the detekt random-call rules find exactly the calls in src/detektFixture/expected-findings.txt'
  group = 'verification'
  dependsOn randomRuleFixture
  def report = randomRuleFixture.flatMap { it.reports.checkstyle.outputLocation }
  def expected = file('src/detektFixture/expected-findings.txt')
  def update = project.hasProperty('updateRandomRuleFixture')
  inputs.file(report)
  inputs.file(expected)
  doLast {
    def found = new XmlSlurper().parse(report.get().asFile).file.error.collect { error ->
      def method = (error.@message.text() =~ /`([^`]+)`/)[0][1]
      "${new File(error.parent().@name.text()).name}:${error.@line}:${error.@column} ${method}"
    }.sort()
    if (update) {
      expected.text = found.join('\n') + '\n'
      return
    }
    def wanted = expected.readLines().findAll { it.trim() }.sort()
    if (found != wanted) {
      throw new GradleException("The random-call rules found other calls than expected-findings.txt lists.\n" +
        "Missing: ${wanted - found}\nNew: ${found - wanted}\n" +
        "Fix config/detekt/detekt.yml, or run with -PupdateRandomRuleFixture after a deliberate change.")
    }
  }
}

tasks.named('check') { dependsOn 'verifyRandomRule' }
