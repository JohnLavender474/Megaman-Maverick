name: MegamanX
sheet: 1LMX.png

defaults:
  cell: [48, 48]
  anchor_y: bottom
  align_x: overlap
  align_to: stand

rows:
  6: {merge: [[4, 8]]}
  14: {split_at: [52]}

animations:
  - {name: crouch, row: 1, frames: [0, 1]}
  - {name: crouch_shoot, row: 1, frames: [2, 3], twin: crouch}

  - {name: damaged, row: 2, frames: [0, 2]}
  - {name: air_damaged, row: 3, frames: [0, 2]}

  - {name: death, row: 4, frames: [0, 4]}
  - {name: death_orb, row: 4, frames: [5, 8], anchor_y: center, align_x: center}

  - {name: dash, row: 5, frames: [0, 1]}
  - {name: dash_shoot, row: 5, frames: [2, 3], twin: dash}

  - {name: spawn_out, row: 6, frames: [0, 6], align_x: center, offsets: {0: [3, 0], 5: [0, -5], 6: [0, -2]}}

  - {name: low_health, row: 7, frames: [0, 4]}
  # stand_simplified.png, jump_v2.png and jump_shoot_v2.png (frames dir) are made by hand, not by this file:
  # stand_simplified is frame 1 (eyes open) and frame 3 (eyes closed) of the stand strip; jump_v2 and jump_shoot_v2
  # are frames 0-4 of the jump and jump_shoot strips. A pack from this file leaves them out of the atlas; add them
  # to the TexturePacker file list. See docs/mega-refactor/items/081-playable-x/branches/mega-refactor-081b-x-run-jump-shoot/docs/NOTES.md.
  # dash_end.png and dash_end_shoot.png (96 x 96, 2 x 2 frames, row by row) are the dash brake, drawn by hand after
  # X6 animation 17; they are also not made by this file. See
  # docs/mega-refactor/items/081-playable-x/branches/mega-refactor-081d-x-dash-sabre/docs/NOTES.md.
  # stand_shoot.png is frame 0 of the jump_shoot strip (the artist's upright pose with the buster forward), also
  # made by hand. The jump offsets put frames 1-5 where the owner moved them by hand (def3f36ea); jump_shoot follows
  # them as a twin. See docs/mega-refactor/items/081-playable-x/branches/mega-refactor-081f-x6-intro-fixes/docs/NOTES.md
  # ("X sprites round 3").
  - {name: stand, row: 8, frames: [0, 4], align_to: null}

  - {name: spawn_in, row: 9, frames: [0, 13], align_x: center}

  - {name: jump, row: 10, frames: [0, 5], offsets: {1: [2, 0], 3: [1, 0], 4: [1, 0]}}
  - {name: land, row: 10, frames: [6, 6]}
  - {name: jump_shoot, row: 11, frames: [0, 5], twin: jump}
  - {name: land_shoot, row: 11, frames: [6, 6], twin: land}

  - {name: climb_start, row: 12, frames: [0, 0]}
  # climb.png (96 x 144, 6 frames) is a hand-made rework (8666af627), not made by this file. Branch 081g moved its
  # frames and climb_shoot 2 px left by hand, to center X on the ladder.
  - {name: climb, row: 12, frames: [1, 4]}
  - {name: climb_shoot, row: 12, frames: [5, 5], offsets: {0: [1, 0]}}
  - {name: climb_finish, row: 12, frames: [6, 7]}

  - {name: r13_unknown, row: 13, frames: [0, 0]}

  - {name: victory, row: 14, frames: [0, 4]}

  - {name: run_trans, row: 15, frames: [0, 0]}
  - {name: run, row: 15, frames: [1, 8]}
  - {name: run_trans_shoot, row: 16, frames: [0, 0], twin: run_trans}
  - {name: run_shoot, row: 16, frames: [1, 8], twin: run}

  - {name: wallslide, row: 17, frames: [0, 1]}
  - {name: walljump, row: 17, frames: [2, 4]}
  - {name: wallslide_shoot, row: 18, frames: [0, 1], twin: wallslide}
  - {name: walljump_shoot, row: 18, frames: [2, 4], twin: walljump}
