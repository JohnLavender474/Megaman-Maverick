name: CI

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gradle:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test and build
        run: ./gradlew --continue engine:test core:test lwjgl3:jar

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            engine/build/reports/tests/test/
            core/build/reports/tests/test/
          retention-days: 7

  utils-pytest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r utils/level_analyzer/requirements-test.txt
          pip install -r utils/level_builder/requirements-test.txt

      - name: Run level-analyzer tests
        run: python -m pytest
        working-directory: utils/level_analyzer

      - name: Run level-builder tests
        run: python -m pytest
        working-directory: utils/level_builder

      - name: Run diagnostics tests
        run: ./run_tests.sh
        working-directory: utils/diagnostics

  utils-node:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run tiled-extensions tests
        run: ./run_tests.sh
        working-directory: utils/tiled_extensions
