config:
  validation: true
  warningsAsErrors: false

processors:
  active: false

console-reports:
  active: true
  exclude:
    - 'ProjectStatisticsReport'
    - 'ComplexityReport'
    - 'NotificationReport'
    - 'FileBasedIssuesReport'

style:
  active: true
  ForbiddenMethodCall:
    active: true
    excludes:
      - '**/engine/common/random/**'
      - '**/src/test/**'
      - '**/src/smokeTest/**'
      - '**/src/allocationTest/**'
    methods:
      - value: 'com.badlogic.gdx.math.MathUtils.random'
        reason: 'Use services.random (GameRandom). Rule O2-R2.'
      - value: 'com.badlogic.gdx.math.MathUtils.randomBoolean'
        reason: 'Use services.random (GameRandom). Rule O2-R2.'
